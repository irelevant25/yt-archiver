server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    client_max_body_size 0;
    # Relative Location headers: redirects keep the scheme/host the visitor used (e.g. https via a proxy)
    absolute_redirect off;

    # Everything requires a signed-in, approved account (checked by PHP), except the locations that
    # switch it off below: /login.php and /setup.php (which returns 404 once the installation is finished)
    auth_request /_auth;
    error_page 401 = @signin;

    location = /_auth {
        internal;
        auth_request off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/includes/auth_check.php;
        fastcgi_param AUTH_ORIGINAL_URI $request_uri;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param CONTENT_TYPE "";
    }

    location @signin {
        auth_request off;
        default_type application/json;
        if ($request_uri ~ ^/api\.php) {
            return 401 '{"error":"Sign in required","login_required":true}';
        }
        return 302 /login.php;
    }

    location = /login.php {
        auth_request off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = /setup.php {
        auth_request off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Internal code: shared PHP includes and the CLI-only background worker
    location ^~ /includes/ {
        deny all;
    }

    location = /download_worker.php {
        deny all;
    }

    # Serve static files directly
    # no-cache forces revalidation on every request; Cloudflare will also not store these
    location /css/ {
        alias /var/www/html/css/;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /js/ {
        alias /var/www/html/js/;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Never serve in-progress downloads (/data/videos/.staging) or other dotfiles
    location ~ ^/(download|videos)/\. {
        deny all;
    }

    # Direct file serving for downloads - more efficient than PHP
    location /download/ {
        alias /data/videos/;
        # Force a single octet-stream Content-Type (add_header would duplicate the header)
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
    }

    location /videos/ {
        alias /data/videos/;
        autoindex off;
    }

    # PHP files
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_buffering off;
    }

    # SPA fallback - only for non-file requests
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
